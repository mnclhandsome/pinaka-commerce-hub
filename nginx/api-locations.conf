# Shared API proxy rules. Include this inside a server { } block.
# Default: /connector/api/v1/* → merchant-service :3003
# Longer prefixes below override that for other services.

# Direct /api/v1/ prefix support (internally rewrites to /connector/api/v1/...)
location ^~ /api/v1/ {
    rewrite ^(/api/v1/.*)$ /connector$1 last;
}

# Merchant-service files (uploads/fastkey-images, employee photos, and so on).
# This must stay ahead of the React location /, otherwise nginx serves index.html
# and the browser shows the home page.
location ^~ /uploads/ {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
}

# Gateway (3000), including its server-sent event stream.
location ^~ /connector/api/v1/gateway/ {
    rewrite ^/connector(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 120s;
}

# Connector-service (3001) — only connector/woocommerce paths, not every /connector/ URL.
location ^~ /connector/api/v1/connectors {
    rewrite ^/connector(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $http_x_correlation_id;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
location ^~ /connector/api/v1/woocommerce {
