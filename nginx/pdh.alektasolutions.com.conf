server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pdh.alektasolutions.com;

    ssl_certificate /etc/letsencrypt/live/pdh.alektasolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdh.alektasolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Gateway (3000), including its server-sent event stream.
    location ^~ /connector/api/v1/gateway/ {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 120s;
    }

    # Connector webhook service (3001).
    # Public: /connector/api/v1/connectors...
    # Upstream: /api/v1/connectors...
    location ^~ /connector/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Refund user validation in merchant-service (3003).
    location ^~ /connector/api/v1/orders/refund-valid-user {
        rewrite ^/connector(/.*)$  break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host System.Management.Automation.Internal.Host.InternalHost;
        proxy_set_header X-Real-IP ;
        proxy_set_header X-Forwarded-For ;
        proxy_set_header X-Forwarded-Proto ;
        proxy_set_header X-Correlation-ID ;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Order service (3002).
    location ^~ /connector/api/v1/orders {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Store POS payment records are served by order-service (3002).
    location ~ ^/connector/api/v1/stores/[^/]+/pos/payment-records/?$ {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Merchant service (3003).
    location ^~ /connector/api/v1/merchants {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Store configuration endpoints, including Website Connector settings (3003).
    location /connector/api/v1/stores {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Menu service (3004). The controller path is plural: /menus.
    location ^~ /connector/api/v1/menus {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Inventory service (3005).
    location ^~ /connector/api/v1/inventory {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Analytics service (3006). The controller path is /analytics, not /revenue.
    location ^~ /connector/api/v1/analytics {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Notification service (3008) currently exposes only health/readiness.
    location = /connector/api/v1/notifications/health {
        proxy_pass http://127.0.0.1:3008/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/api/v1/notifications/ready {
        proxy_pass http://127.0.0.1:3008/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin API (3009) currently exposes only health/readiness.
    location = /connector/api/v1/admin/health {
        proxy_pass http://127.0.0.1:3009/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/api/v1/admin/ready {
        proxy_pass http://127.0.0.1:3009/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth service (3010): authentication, users, development mailbox and POS account.
    location = /connector/api/v1/auth/health {
        proxy_pass http://127.0.0.1:3010/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/api/v1/auth/ready {
        proxy_pass http://127.0.0.1:3010/ready;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /connector/api/v1/auth/ {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ^~ /connector/api/v1/users {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location ^~ /connector/api/v1/dev/ {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/api/pos/account {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/accept-invitation {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /connector/reset-password {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # POS integration service (3007), following the primary port allocation.
    location ^~ /connector/api/v1/pos {
        rewrite ^/connector(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Merchant-service files. Keep this ahead of the React fallback.
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # React frontend. Keep this last so API requests are not handled by the SPA fallback.
    location / {
        root /var/www/pdh;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name pdh.alektasolutions.com;
    return 301 https://$host$request_uri;
}
